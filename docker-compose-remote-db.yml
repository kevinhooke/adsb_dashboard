services:

  django-db-migrate:
    image: 10.0.10.2:5000/adsb-dashboard:latest
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-10.0.10.5}
      DB_NAME: ${DB_NAME:-adsb_dashboard}
    command: ["poetry", "run", "python", "manage.py", "migrate"]

  web:
    image: 10.0.10.2:5000/adsb-dashboard:latest
    command: ["poetry", "run", "gunicorn", "adsb_dashboard.wsgi:application", "--bind", "0.0.0.0:8001", "--workers", "2", "--worker-class", "gthread", "--threads", "4"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-10.0.10.5}
      DB_NAME: ${DB_NAME:-adsb_dashboard}
      DEBUG: "False"
      DB_CONN_MAX_AGE: "60"
    ports:
      - 8001:8001
    restart: unless-stopped
    depends_on:
      django-db-migrate:
        condition: service_completed_successfully
