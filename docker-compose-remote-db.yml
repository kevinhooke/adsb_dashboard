services:

  django-db-migrate:
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    build:
      context: .
    command: ["poetry", "run", "python", "manage.py", "migrate"]

  web:
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    build:
      context: .
    ports:
      - 8000:8000
    depends_on:
      django-db-migrate:
        condition: service_completed_successfully
