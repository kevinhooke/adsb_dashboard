apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adsb-dashboard
  labels: 
    app: adsb-dashboard
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`adsb.vlan10`)"
      kind: "Rule"
      services: 
        - name: adsb-dashboard-service
          namespace: default
          port: 8000
