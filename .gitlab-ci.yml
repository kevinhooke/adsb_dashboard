default:
  tags:
    - docker
  image: docker:29.1.3-cli
  services:
    - docker:29.1.3-dind

build_image:
  script:
  # tag and push to local docker registry
  - docker build -t 10.0.10.2:5000/adsb-dashboard:latest .
  - docker push 10.0.10.2:5000/adsb-dashboard:latest

deploy:
  stage: deploy
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - touch ~/.ssh/config
    - echo "StrictHostKeyChecking no" >> ~/.ssh/config
    - touch ~/.ssh/known_hosts
    - chmod -R 400 ~/.ssh
    - docker context create remote --docker "host=ssh://gitlab-runner@10.0.10.2" 
  script:
    - docker --context remote compose -f docker-compose-remote-db.yml up -d --pull always
