default:
  tags:
    - docker
  image: docker:29.1.3-cli
  services:
    - docker:29.1.3-dind
#  before_script:
#    - docker info

build_image:
  script:
  #  - echo "$CI_REGISTRY_PASSWORD" | docker login registry.gitlab.homelab.kevinhooke.com -u $CI_REGISTRY_USER --password-stdin
  #  - docker build -t $CI_REGISTRY_IMAGE:latest .
  #  - docker push $CI_REGISTRY_IMAGE:latest
  # tag and push to local docker registry
  - docker build -t 10.0.10.3:5000/adsb-dashboard:latest .
  - docker push 10.0.10.3:5000/adsb-dashboard:latest

configure-dev-context:
  stage: deploy
  image: docker:latest
  script:
    - docker context create remote --docker "host=ssh://gitlab-runner@10.0.10.3"
    - docker context use remote
    - docker context ls

deploy:
  stage: deploy
  image: docker:latest
  script:
    - docker context use remote
    - docker compose up -d -f docker-compose-remote-db.yml
