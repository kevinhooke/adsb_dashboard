services:

  django-db-migrate:
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    build:
      context: .
    command: ["poetry", "run", "python", "manage.py", "migrate"]
    depends_on:
      - postgres

  web:
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    build:
      context: .
    ports:
      - 8000:8000
    depends_on:
      - postgres

  postgres:
    image: postgres:18.0
    environment:
      POSTGRES_DB: postgresdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
